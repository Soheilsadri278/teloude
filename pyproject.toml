[Tooling]
# Poetry/PDM compatible configuration file

[tool.poetry]
name = "teloude"
version = "0.1.0"
description = "A professional desktop backup application using Telegram MTProto API."
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
PySide6 = "^6.5.0"      # Qt UI (Windows desktop)
telethon = "^1.44.0"    # MTProto client (Telegram infrastructure layer only)
pydantic = "^2.0"       # For configuration management
pillow = ">=10.0"       # Image previews and thumbnails
imageio-ffmpeg = ">=0.5.1"  # Video thumbnails (ffmpeg binary, optional at runtime)

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
mypy = "^1.0"
ruff = "^0.6"

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = ["build", "dist", "installer/Output", "assets"]

[tool.ruff.lint]
# Errors only: undefined names, unused imports/variables, syntax-level problems.
# Run with:  python -m ruff check teloude/
select = ["F", "E9"]