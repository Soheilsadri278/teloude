[Tooling]
# Poetry/PDM compatible configuration file

[tool.poetry]
name = "teloude"
version = "0.1.0"
description = "A professional desktop backup application using Telegram MTProto API."
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
PySide6 = "^5.15.0" # Or latest stable version
SQLAlchemy = "^2.0.0" # For robust DB interaction
pydantic = "^2.0"    # For configuration management
telethon = "^1.44.0" # MTProto client (Telegram infrastructure layer only)

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
mypy = "^1.0"